# On a version tag: build static .debs, attach them to a GitHub release and
# publish the signed APT repository to the gh-pages branch.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release

jobs:
  deb:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo deb --target ${{ matrix.target }} --output debs/
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.target }}
          path: debs/*.deb

  publish:
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs
      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::The APT_SIGNING_KEY repository secret is missing or empty"
            exit 1
          fi
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          if [ -z "$(gpg --list-secret-keys)" ]; then
            echo "::error::APT_SIGNING_KEY must be an armored private key"
            exit 1
          fi
      - run: packaging/apt/build-repo.sh debs site
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" debs/*.deb --title "$GITHUB_REF_NAME" --generate-notes
      - name: Publish the APT repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              commit -q -m "APT repository for $GITHUB_REF_NAME"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
