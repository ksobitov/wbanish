# On a version tag: test, build static .debs, attach them to a GitHub release
# and publish the signed APT repository to the gh-pages branch.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  deb:
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo deb --target ${{ matrix.target }} --output debs/
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.target }}
          path: debs/*.deb

  publish:
    needs: deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # All tags, to tell whether this is the newest release.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" debs/*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" debs/*.deb --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Check that this is the newest release
        id: newest
        run: |
          newest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_REF_NAME is older than $newest, so the APT repository stays as it is"
          fi
      - name: Import the signing key
        if: steps.newest.outputs.publish == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::The APT_SIGNING_KEY repository secret is missing or empty"
            exit 1
          fi
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          if [ -z "$(gpg --list-secret-keys)" ]; then
            echo "::error::APT_SIGNING_KEY must be an armored private key"
            exit 1
          fi
      - name: Keep the packages already published
        if: steps.newest.outputs.publish == 'true'
        run: |
          # Older versions stay downloadable, also by clients that still have
          # the previous index while Pages updates.
          if git fetch --quiet origin gh-pages; then
            mkdir -p old
            git archive FETCH_HEAD pool | tar -x -C old || true
            for deb in old/pool/main/*.deb; do
              if [ -e "$deb" ] && [ ! -e "debs/${deb##*/}" ]; then
                cp "$deb" debs/
              fi
            done
          fi
      - name: Build the APT repository
        if: steps.newest.outputs.publish == 'true'
        run: packaging/apt/build-repo.sh debs site
      - name: Publish the APT repository
        if: steps.newest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              commit -q -m "APT repository for $GITHUB_REF_NAME"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
